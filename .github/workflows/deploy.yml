
name: Build and Deploy RenPy Web Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ren'Py
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: "8.5.3"
          web: true

      - name: Build web game
        run: renpy-launcher web_build . --destination web

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
